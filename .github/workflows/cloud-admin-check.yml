name: Verify corporate cloud admin
on:
  push:
    branches: [feature/cloud-admin-v04]
  pull_request:
    paths:
      - 'react-app/**'
      - 'database/**'
      - '.github/workflows/cloud-admin-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Logic tests
        run: npm run test:core
      - name: Build production app
        run: npm run build
      - name: Verify no service credentials
        run: |
          if grep -r -E 'sb_secret_|service_role[[:space:]]*=' src; then exit 1; fi
          test -f dist/index.html
