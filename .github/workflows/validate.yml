name: STAGE84 validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --check admin.js
      - run: node --check public-sync.js
      - run: node --experimental-strip-types --check supabase/functions/manage-admin-account/index.ts
      - run: node tests/smoke.mjs
