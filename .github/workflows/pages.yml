name: Deploy independent corporate React preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - name: Install locked dependencies
        working-directory: react-app
        run: npm ci --no-audit --no-fund
      - name: Typecheck React
        working-directory: react-app
        run: npm run typecheck
      - name: Test core logic and native Excel exports
        working-directory: react-app
        run: npm run test:core
      - name: Verify new Saeed Supabase public policies
        working-directory: react-app
        env:
          VITE_CORP_SUPABASE_URL: ${{ vars.CORP_SUPABASE_URL || 'https://afrvoshsiqartsketiuv.supabase.co' }}
          VITE_CORP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CORP_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_0fyTTziF-9PaGtp--sxn1w_qQtJe93i' }}
        run: node tests/cloud-public-smoke.mjs
      - name: Check quote endpoint rejects unverified submissions
        working-directory: react-app
        env:
          VITE_CORP_SUPABASE_URL: ${{ vars.CORP_SUPABASE_URL || 'https://afrvoshsiqartsketiuv.supabase.co' }}
          VITE_CORP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CORP_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_0fyTTziF-9PaGtp--sxn1w_qQtJe93i' }}
        run: node tests/cloud-quote-intake-smoke.mjs
      - name: Build React
        working-directory: react-app
        env:
          VITE_CORP_SUPABASE_URL: ${{ vars.CORP_SUPABASE_URL || 'https://afrvoshsiqartsketiuv.supabase.co' }}
          VITE_CORP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CORP_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_0fyTTziF-9PaGtp--sxn1w_qQtJe93i' }}
          VITE_CORP_TURNSTILE_SITE_KEY: ${{ vars.CORP_TURNSTILE_SITE_KEY }}
        run: npm run build
      - name: Validate corporate static subpages
        run: node tests/static-pages.mjs
      - name: Include independent corporate subpages
        run: |
          cp about.html services.html projects.html contact.html pages.css react-app/dist/
          test -f react-app/dist/index.html
          test -f react-app/dist/about.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: react-app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
