<!doctype html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff9f0a" />
  <meta name="description" content="Digital Business Card" />
  <title>Digital Business Card</title>
<style>
:root{
      --brand:#ff9f0a;
      --brand-deep:#ef8800;
      --ink:#171717;
      --muted:#737373;
      --line:#ece7df;
      --paper:#ffffff;
      --soft:#fff8ee;
      --canvas:#f7f7f5;
      --radius-xl:34px;
      --radius-lg:24px;
      --radius-md:18px;
      --shadow:0 20px 70px rgba(24,24,24,.09);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100svh;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Arial,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(255,159,10,.08), transparent 30%),
        radial-gradient(circle at 90% 100%, rgba(255,159,10,.055), transparent 28%),
        var(--canvas);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    a,button{-webkit-tap-highlight-color:transparent}
    a{text-decoration:none;color:inherit}
    button{font:inherit}
    .page{
      width:min(100%, 580px);
      margin:0 auto;
      padding:18px 14px max(28px, env(safe-area-inset-bottom));
    }
    .card{
      position:relative;
      overflow:hidden;
      background:var(--paper);
      border:1px solid rgba(20,20,20,.045);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow);
    }
    .hero{
      position:relative;
      overflow:hidden;
      min-height:390px;
      padding:24px 22px 28px;
      background:
        radial-gradient(circle at 90% 12%, rgba(255,255,255,.92), transparent 22%),
        radial-gradient(circle at 13% 96%, rgba(255,255,255,.60), transparent 30%),
        linear-gradient(145deg,#fff 0%,#fff8ec 46%,#ffe9c4 100%);
      isolation:isolate;
    }
    .hero::before{
      content:"";
      position:absolute;
      width:250px;height:250px;
      right:-94px;top:-84px;
      border:30px solid rgba(255,159,10,.14);
      border-radius:50%;
      z-index:-2;
    }
    .hero::after{
      content:"";
      position:absolute;
      width:175px;height:175px;
      left:-74px;bottom:-98px;
      background:rgba(255,159,10,.14);
      border-radius:50%;
      z-index:-2;
    }
    .watermark{
      position:absolute;
      width:295px;
      right:-58px;
      bottom:-64px;
      opacity:.055;
      filter:grayscale(1) contrast(1.1);
      transform:rotate(-7deg);
      pointer-events:none;
      z-index:-1;
      mix-blend-mode:multiply;
    }
    .brand-row{
      display:flex;
      align-items:center;
      gap:12px;
      width:max-content;
      max-width:100%;
    }
    .brand-logo{
      width:62px;height:62px;
      border-radius:20px;
      object-fit:contain;
      background:#fff;
      padding:5px;
      box-shadow:0 10px 28px rgba(24,24,24,.08);
      border:1px solid rgba(0,0,0,.04);
    }
    .brand-name{
      min-width:0;
    }
    .brand-name strong{
      display:block;
      font-size:20px;
      line-height:1.1;
      letter-spacing:.01em;
    }
    .brand-name span{
      display:block;
      margin-top:5px;
      font-size:13px;
      color:#6d665d;
      direction:rtl;
      text-align:left;
      font-weight:650;
    }
    .identity{
      display:grid;
      grid-template-columns:minmax(142px, 40%) 1fr;
      align-items:end;
      gap:20px;
      margin-top:30px;
    }
    .portrait-wrap{
      position:relative;
      aspect-ratio:4/5;
      min-height:188px;
      border-radius:30px;
      overflow:hidden;
      background:#f4eee6;
      border:6px solid rgba(255,255,255,.88);
      box-shadow:0 19px 40px rgba(49,35,15,.16);
    }
    .portrait-wrap::after{
      content:"";
      position:absolute;
      inset:0;
      border:1px solid rgba(255,255,255,.55);
      border-radius:inherit;
      pointer-events:none;
    }
    .portrait{
      width:100%;height:100%;
      object-fit:cover;
      object-position:center 33%;
      display:block;
    }
    .person{
      padding:3px 0 9px;
      min-width:0;
    }
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:7px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.72);
      border:1px solid rgba(255,159,10,.20);
      color:#9b5900;
      font-size:10px;
      font-weight:800;
      letter-spacing:.13em;
      white-space:nowrap;
    }
    .eyebrow::before{
      content:"";
      width:7px;height:7px;
      border-radius:50%;
      background:var(--brand);
      box-shadow:0 0 0 4px rgba(255,159,10,.12);
    }
    h1{
      margin:13px 0 7px;
      font-size:clamp(31px, 8vw, 43px);
      line-height:.98;
      letter-spacing:-.045em;
      text-transform:capitalize;
      overflow-wrap:anywhere;
    }
    .role{
      margin:0;
      direction:rtl;
      text-align:left;
      font-size:16px;
      font-weight:750;
      color:#5d554c;
    }
    .role-en{
      margin:5px 0 0;
      font-size:12px;
      color:#8b8278;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    .body{padding:20px 18px 24px}
    .save-btn{
      width:100%;
      min-height:58px;
      border:0;
      border-radius:20px;
      background:linear-gradient(135deg,var(--brand) 0%,#ffb12e 100%);
      color:#18120a;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      cursor:pointer;
      font-weight:850;
      font-size:16px;
      box-shadow:0 13px 25px rgba(255,159,10,.22);
      transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .save-btn:active{transform:translateY(1px) scale(.995)}
    .save-btn:hover{filter:saturate(1.04);box-shadow:0 16px 29px rgba(255,159,10,.27)}
    .save-btn svg,.action svg,.info-icon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .quick-actions{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-top:11px;
    }
    .action{
      min-width:0;
      min-height:70px;
      border-radius:18px;
      background:#faf9f7;
      border:1px solid #efede9;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:7px;
      font-size:12px;
      font-weight:760;
      transition:.18s ease;
    }
    .action svg{width:22px;height:22px;color:#2e2b27}
    .action:hover{transform:translateY(-2px);background:#fff8ec;border-color:#ffe0aa}
    .action:active{transform:translateY(0)}
    .section-title{
      margin:24px 3px 11px;
      color:#868079;
      font-size:11px;
      font-weight:820;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .info-list{
      border:1px solid #efede8;
      border-radius:22px;
      overflow:hidden;
      background:#fff;
    }
    .info-item{
      display:grid;
      grid-template-columns:44px minmax(0,1fr) 24px;
      align-items:center;
      gap:12px;
      min-height:77px;
      padding:11px 14px;
      border-bottom:1px solid #f0eee9;
      transition:background .18s ease;
    }
    .info-item:last-child{border-bottom:0}
    .info-item:hover{background:#fffcf7}
    .info-icon{
      width:44px;height:44px;
      border-radius:14px;
      background:#fff4e1;
      color:#b56500;
      display:grid;
      place-items:center;
    }
    .info-main{min-width:0}
    .info-label{
      display:block;
      margin-bottom:4px;
      color:#9a948d;
      font-size:10px;
      font-weight:850;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .info-value{
      display:block;
      color:#272521;
      font-size:14px;
      font-weight:710;
      line-height:1.38;
      overflow-wrap:anywhere;
    }
    .info-value.ar{direction:rtl;text-align:left}
    .arrow{color:#bbb4ab;width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .branch-tag{
      display:inline-flex;
      align-items:center;
      margin-top:3px;
      padding:3px 8px;
      border-radius:999px;
      background:#f8f5f0;
      color:#7b736a;
      font-size:11px;
      direction:rtl;
    }
    .footer{
      padding:17px 2px 1px;
      text-align:center;
      color:#aaa39a;
      font-size:10px;
      letter-spacing:.05em;
    }
    .toast{
      position:fixed;
      left:50%;
      bottom:max(24px, env(safe-area-inset-bottom));
      transform:translate(-50%,20px);
      width:max-content;
      max-width:calc(100vw - 32px);
      padding:12px 16px;
      border-radius:999px;
      background:#1c1c1c;
      color:#fff;
      font-size:12px;
      font-weight:700;
      opacity:0;
      pointer-events:none;
      transition:.25s ease;
      z-index:50;
      box-shadow:0 12px 34px rgba(0,0,0,.22);
      direction:rtl;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    :focus-visible{outline:3px solid rgba(255,159,10,.38);outline-offset:3px}

    @media (max-width:379px){
      .page{padding-left:10px;padding-right:10px}
      .hero{padding:20px 18px 24px}
      .identity{grid-template-columns:1fr;align-items:start;margin-top:24px}
      .portrait-wrap{width:57%;min-width:175px;aspect-ratio:4/5}
      .person{padding-top:0}
      h1{font-size:38px}
      .role,.role-en{text-align:left}
    }
    @media (min-width:700px){
      .page{padding-top:34px;padding-bottom:42px}
      .card{border-radius:38px}
      .hero{padding:30px 30px 34px}
      .body{padding:24px 24px 30px}
      .identity{grid-template-columns:190px 1fr;gap:28px;margin-top:34px}
      .portrait-wrap{min-height:232px}
    }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
    }

    /* Responsive Products catalog */
    .products-btn{
      width:100%;
      min-height:64px;
      margin-top:11px;
      border:1px solid #ffd692;
      border-radius:20px;
      background:linear-gradient(135deg,#fff9ef 0%,#fff 72%);
      color:#2b241b;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:11px 16px;
      cursor:pointer;
      font-family:inherit;
      box-shadow:0 8px 22px rgba(37,31,23,.05);
      transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
    }
    .products-btn:hover{transform:translateY(-2px);border-color:#ffb43c;box-shadow:0 12px 26px rgba(255,159,10,.13)}
    .products-btn:active{transform:translateY(0)}
    .products-btn-left{display:flex;align-items:center;gap:12px;min-width:0}
    .products-btn-icon{
      width:44px;height:44px;flex:0 0 44px;border-radius:14px;
      display:grid;place-items:center;background:#fff0d5;color:#b56500;
    }
    .products-btn-icon svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .products-btn-copy{text-align:right;line-height:1.2}
    .products-btn-copy strong{display:block;font-size:16px;font-weight:900;color:#1e1a16}
    .products-btn-copy small{display:block;margin-top:4px;font-size:11px;color:#8b8379;font-weight:700;letter-spacing:.04em}
    .products-btn-arrow{width:22px;height:22px;stroke:#a19a91;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transform:rotate(180deg);flex:0 0 auto}

    .catalog-modal{
      position:fixed;inset:0;z-index:9999;display:none;
      background:rgba(20,18,15,.60);backdrop-filter:blur(8px);
      padding:12px;overflow:auto;overscroll-behavior:contain;
    }
    .catalog-modal.open{display:block}
    body.catalog-open{overflow:hidden}
    .catalog-sheet{
      width:min(100%,980px);margin:0 auto;background:#f7f6f3;
      border-radius:26px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.28);
      border:1px solid rgba(255,255,255,.65);
    }
    .catalog-header{
      position:sticky;top:0;z-index:3;
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      padding:16px 16px 14px;
      background:rgba(255,255,255,.95);backdrop-filter:blur(14px);
      border-bottom:1px solid #ece8e1;
    }
    .catalog-title-wrap{min-width:0;text-align:right;direction:rtl}
    .catalog-kicker{display:block;color:#c16b00;font-size:10px;font-weight:900;letter-spacing:.14em;direction:ltr;text-align:right}
    .catalog-title{margin:2px 0 0;font-size:24px;line-height:1.2;font-weight:950;color:#17130f}
    .catalog-subtitle{margin:4px 0 0;color:#7b746b;font-size:12px;font-weight:650}
    .catalog-close{
      width:44px;height:44px;flex:0 0 44px;border:1px solid #ebe7e0;border-radius:14px;
      background:#fff;color:#29231d;display:grid;place-items:center;cursor:pointer;
    }
    .catalog-close svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
    .catalog-toolbar{
      display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
      padding:12px 14px;background:#fff;border-bottom:1px solid #ece8e1;
    }
    .catalog-note{margin:0;color:#756e65;font-size:12px;direction:rtl;text-align:right;flex:1 1 220px}
    .catalog-download{
      min-height:44px;border:0;border-radius:14px;padding:0 15px;
      background:linear-gradient(135deg,#ff9700,#ffb32c);color:#18120b;
      font-family:inherit;font-size:13px;font-weight:900;cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
    }
    .catalog-download svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .catalog-grid{
      display:grid;grid-template-columns:1fr;gap:14px;padding:14px;
    }
    .catalog-tabs{
      display:flex;gap:10px;padding:0 14px 14px;flex-wrap:wrap;
    }
    .catalog-tab{
      flex:1 1 140px;min-height:54px;border:1px solid #eadcc6;border-radius:18px;
      background:#fff;color:#2c241a;padding:11px 14px;display:flex;flex-direction:column;
      justify-content:center;align-items:flex-start;gap:2px;cursor:pointer;font-family:inherit;
      transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,background .18s ease;
      box-shadow:0 8px 18px rgba(31,24,16,.04);
    }
    .catalog-tab strong{font-size:15px;font-weight:800}
    .catalog-tab small{font-size:11px;color:#8a7a67;font-weight:700}
    .catalog-tab.active{
      border-color:#f4a51b;background:linear-gradient(135deg,#fff9ee 0%,#fff4de 100%);
      box-shadow:0 12px 24px rgba(244,165,27,.12);
    }
    .catalog-tab:hover{transform:translateY(-1px)}
    .catalog-panel{display:none}
    .catalog-panel.active{display:block}
    .chandeliers-intro{
      padding:0 14px 14px;color:#6e6256;font-size:13px;font-weight:600;
    }
    .chandeliers-grid{
      display:grid;grid-template-columns:1fr;gap:14px;padding:0 14px 18px;
    }
    .chandelier-card{
      margin:0;background:#fff;border:1px solid #e8e3dc;border-radius:18px;overflow:hidden;
      box-shadow:0 8px 24px rgba(25,20,14,.06);
    }
    .chandelier-thumb{
      aspect-ratio:4 / 5;background:#fbfaf8;display:flex;align-items:center;justify-content:center;overflow:hidden;
    }
    .chandelier-thumb .product-image-button{height:100%}
    .chandelier-thumb img{display:block;width:100%;height:100%;object-fit:cover}
    .chandelier-card figcaption{
      padding:10px 12px;text-align:center;color:#5c5247;font-size:13px;font-weight:800;
      border-top:1px solid #f0ede8;background:#fff;
    }
    .balfon-intro{
      padding:0 14px 14px;color:#6e6256;font-size:13px;font-weight:600;
    }
    .balfon-grid{
      display:grid;grid-template-columns:1fr;gap:14px;padding:0 14px 18px;
    }
    .balfon-card{
      margin:0;background:#fff;border:1px solid #e8e3dc;border-radius:18px;overflow:hidden;
      box-shadow:0 8px 24px rgba(25,20,14,.06);
    }
    .balfon-thumb{
      background:#fbfaf8;display:flex;align-items:center;justify-content:center;overflow:hidden;
    }
    .balfon-thumb img{display:block;width:100%;height:auto;object-fit:contain}
    .balfon-card figcaption{
      padding:10px 12px;text-align:center;color:#5c5247;font-size:13px;font-weight:800;
      border-top:1px solid #f0ede8;background:#fff;
    }
    .catalog-page{
      margin:0;background:#fff;border:1px solid #e8e3dc;border-radius:18px;overflow:hidden;
      box-shadow:0 8px 24px rgba(25,20,14,.06);
    }
    .catalog-page img{display:block;width:100%;height:auto;background:#fff}
    .catalog-page figcaption{
      padding:8px 12px;text-align:center;color:#8b8379;font-size:11px;font-weight:800;
      border-top:1px solid #f0ede8;background:#fff;
    }
    /* Product image lightbox */
    .product-image-button{
      position:relative;display:block;width:100%;padding:0;border:0;background:transparent;
      color:inherit;font:inherit;cursor:zoom-in;text-align:inherit;overflow:hidden;
    }
    .product-image-button img{transition:transform .22s ease,filter .22s ease}
    .product-image-button:hover img{transform:scale(1.025);filter:brightness(.98)}
    .product-image-button:focus-visible{outline:3px solid #f4a51b;outline-offset:-3px}
    .image-zoom-badge{
      position:absolute;left:10px;bottom:10px;z-index:1;width:36px;height:36px;border-radius:12px;
      display:grid;place-items:center;background:rgba(20,18,15,.72);color:#fff;
      box-shadow:0 8px 20px rgba(0,0,0,.18);backdrop-filter:blur(8px);pointer-events:none;
      opacity:.92;transition:transform .18s ease,background .18s ease;
    }
    .product-image-button:hover .image-zoom-badge{transform:scale(1.05);background:rgba(20,18,15,.82)}
    .image-zoom-badge svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    .image-lightbox{
      position:fixed;inset:0;z-index:12000;display:none;align-items:center;justify-content:center;
      padding:18px;background:rgba(9,8,7,.88);backdrop-filter:blur(12px);overscroll-behavior:contain;
    }
    .image-lightbox.open{display:flex}
    body.image-lightbox-open{overflow:hidden}
    .image-lightbox-dialog{
      position:relative;width:min(100%,1100px);max-height:calc(100dvh - 36px);display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:10px;outline:none;
    }
    .image-lightbox-stage{
      width:100%;min-height:0;display:flex;align-items:center;justify-content:center;
    }
    .image-lightbox-stage img{
      display:block;max-width:100%;max-height:calc(100dvh - 110px);width:auto;height:auto;
      object-fit:contain;border-radius:16px;background:#fff;box-shadow:0 28px 80px rgba(0,0,0,.4);
      user-select:none;-webkit-user-drag:none;
    }
    .image-lightbox-close{
      position:absolute;top:10px;right:10px;z-index:2;width:46px;height:46px;border:1px solid rgba(255,255,255,.22);
      border-radius:15px;background:rgba(15,13,11,.72);color:#fff;display:grid;place-items:center;
      cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.22);backdrop-filter:blur(10px);
    }
    .image-lightbox-close:hover{background:rgba(15,13,11,.9)}
    .image-lightbox-close:focus-visible{outline:3px solid #ffb43c;outline-offset:3px}
    .image-lightbox-close svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
    .image-lightbox-caption{
      margin:0;max-width:90%;padding:7px 12px;border-radius:12px;background:rgba(15,13,11,.66);
      color:#fff;text-align:center;font-size:13px;font-weight:800;line-height:1.5;backdrop-filter:blur(8px);
    }
    @media (max-width:600px){
      .image-lightbox{padding:10px}
      .image-lightbox-dialog{max-height:calc(100dvh - 20px)}
      .image-lightbox-stage img{max-height:calc(100dvh - 86px);border-radius:12px}
      .image-lightbox-close{top:8px;right:8px;width:44px;height:44px;border-radius:14px}
      .image-lightbox-caption{font-size:12px;max-width:96%}
      .image-zoom-badge{width:34px;height:34px;left:8px;bottom:8px}
    }
    @media (min-width:760px){
      .catalog-modal{padding:22px}
      .catalog-header{padding:18px 22px 16px}
      .catalog-toolbar{padding:12px 22px}
      .catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:18px}
      .chandeliers-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:0 18px 22px}
      .balfon-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:0 18px 22px}

/* Lightbox gallery navigation: swipe + previous / next */
.image-lightbox-stage{
  position:relative;touch-action:pan-y;overflow:hidden;
}
.image-lightbox-nav{
  position:absolute;top:50%;z-index:3;transform:translateY(-50%);
  width:48px;height:48px;border:1px solid rgba(255,255,255,.22);border-radius:16px;
  background:rgba(15,13,11,.68);color:#fff;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 10px 28px rgba(0,0,0,.22);backdrop-filter:blur(10px);
  transition:background .18s ease,transform .18s ease,opacity .18s ease;
}
.image-lightbox-nav:hover{background:rgba(15,13,11,.9)}
.image-lightbox-nav:active{transform:translateY(-50%) scale(.94)}
.image-lightbox-nav:focus-visible{outline:3px solid #ffb43c;outline-offset:3px}
.image-lightbox-nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.image-lightbox-prev{left:10px}
.image-lightbox-next{right:10px}
.image-lightbox-meta{display:flex;align-items:center;justify-content:center;gap:8px;max-width:96%}
.image-lightbox-counter{
  flex:0 0 auto;padding:7px 10px;border-radius:12px;background:rgba(15,13,11,.66);
  color:#fff;font-size:12px;font-weight:900;line-height:1.5;direction:ltr;backdrop-filter:blur(8px);
}
.image-lightbox-stage img.slide-from-right{animation:lightboxFromRight .22s ease-out}
.image-lightbox-stage img.slide-from-left{animation:lightboxFromLeft .22s ease-out}
@keyframes lightboxFromRight{from{opacity:.35;transform:translateX(26px) scale(.985)}to{opacity:1;transform:none}}
@keyframes lightboxFromLeft{from{opacity:.35;transform:translateX(-26px) scale(.985)}to{opacity:1;transform:none}}
@media (max-width:600px){
  .image-lightbox-nav{width:42px;height:42px;border-radius:14px;opacity:.88}
  .image-lightbox-prev{left:4px}
  .image-lightbox-next{right:4px}
  .image-lightbox-meta{gap:6px}
  .image-lightbox-counter{padding:6px 9px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  .image-lightbox-stage img.slide-from-right,.image-lightbox-stage img.slide-from-left{animation:none}
}

  function showToast(message) {

    if (!toast) return;

    toast.classList.add('show');
    window.clearTimeout(window.__toastTimer);
    window.__toastTimer = window.setTimeout(() => toast.classList.remove('show'), 2200);

  function downloadFile(path, filename) {
    const link = document.createElement('a');
    link.href = path;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
  }

  function createZoomButton(item, imageLoading = 'lazy', collection = [item], index = 0) {
    const button = document.createElement('button');
    button.className = 'product-image-button';
    button.type = 'button';
    button.setAttribute('aria-label', `تكبير صورة ${item.caption || item.alt || 'المنتج'}`);

    const image = document.createElement('img');
    image.src = item.image;
    image.alt = item.alt;
    image.loading = imageLoading;

    const badge = document.createElement('span');
    badge.className = 'image-zoom-badge';
    badge.setAttribute('aria-hidden', 'true');
    badge.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path><path d="M11 8v6M8 11h6"></path></svg>';

    button.append(image, badge);
    button.addEventListener('click', () => openImageLightbox(item, button, collection, index));
    return button;
  }

  function createCatalogPage(item, index, collection) {
    const figure = document.createElement('figure');
    figure.className = 'catalog-page';

    const imageButton = createZoomButton(item, index === 0 ? 'eager' : 'lazy', collection, index);

    const caption = document.createElement('figcaption');
    caption.textContent = item.caption;

    figure.append(imageButton, caption);
    return figure;
  }

  function createProductCard(item, type, collection, index) {
    const figure = document.createElement('figure');
    figure.className = `${type}-card`;

    const thumb = document.createElement('div');
    thumb.className = `${type}-thumb`;

    const imageButton = createZoomButton(item, 'lazy', collection, index);

    const caption = document.createElement('figcaption');
    caption.textContent = item.caption;

    const whatsappLink = createProductWhatsAppLink(item);

    thumb.appendChild(imageButton);
    figure.append(thumb, caption, whatsappLink);
    return figure;
  }

  function renderExtraSections(data) {
    const tabsHost = $('.catalog-tabs');
    const sheet = $('.catalog-sheet');
    const empty = $('#dynamicCatalogEmpty');
    if (!tabsHost || !sheet) return;

    tabsHost.replaceChildren();
    $$('.extra-section-panel', sheet).forEach((node) => node.remove());

    const sections = Array.isArray(data.extraSections) ? data.extraSections : [];
    if (empty) empty.style.display = sections.length ? 'none' : 'block';

    sections.forEach((section, sectionIndex) => {
      const safeId = `extraSectionPanel${sectionIndex}`;
      const tab = document.createElement('button');
      tab.className = `catalog-tab extra-section-tab${sectionIndex===0?' active':''}`;
      tab.type = 'button';
      tab.dataset.target = safeId;
      tab.setAttribute('aria-pressed', sectionIndex===0 ? 'true' : 'false');
      tab.innerHTML = `<strong></strong><small></small>`;
      tab.querySelector('strong').textContent = section.name || 'قسم';
      tab.querySelector('small').textContent = `${Array.isArray(section.items) ? section.items.length : 0} منتج`;
      tab.addEventListener('click', () => {
        setCatalogPanel(safeId);
        trackEvent('product_category_view', { category: section.name || 'قسم', panel_id: safeId });
      });
      tabsHost.appendChild(tab);

      const panel = document.createElement('section');
      panel.className = `catalog-panel extra-section-panel${sectionIndex===0?' active':''}`;
      panel.id = safeId;

      const intro = document.createElement('p');
      intro.className = 'extra-section-intro';
      intro.textContent = section.description || `منتجات قسم ${section.name || 'القسم'}`;

      const grid = document.createElement('div');
      grid.className = 'extra-section-grid';
      grid.dir = 'rtl';
      const items = Array.isArray(section.items) ? section.items : [];
      const fragment = document.createDocumentFragment();
      items.forEach((item, index) => fragment.appendChild(createProductCard(item, 'chandelier', items, index)));
      grid.appendChild(fragment);
      panel.append(intro, grid);
      sheet.appendChild(panel);
    });
  }

  function renderProducts() {
    const data = window.FLOWER_LIGHT_PRODUCTS || {extraSections:[]};
    renderExtraSections(data);
  }

  window.flRenderProducts = renderProducts;


  const imageLightbox = $('#imageLightbox');
  const imageLightboxImage = $('#imageLightboxImage');
  const imageLightboxCaption = $('#imageLightboxCaption');
  const imageLightboxCounter = $('#imageLightboxCounter');
  const imageLightboxWhatsApp = $('#imageLightboxWhatsApp');
  const imageLightboxStage = $('#imageLightboxStage');
  const closeImageLightboxButton = $('#closeImageLightbox');
  const prevImageLightboxButton = $('#imageLightboxPrev');
  const nextImageLightboxButton = $('#imageLightboxNext');
  let lightboxLastFocus = null;
  let lightboxItems = [];
  let lightboxIndex = 0;
  let touchStartX = 0;
  let touchStartY = 0;

  function normalizeLightboxIndex(index) {
    if (!lightboxItems.length) return 0;
    return (index + lightboxItems.length) % lightboxItems.length;
  }

  function preloadLightboxNeighbors() {
    if (lightboxItems.length < 2) return;
    const prev = lightboxItems[normalizeLightboxIndex(lightboxIndex - 1)];
    const next = lightboxItems[normalizeLightboxIndex(lightboxIndex + 1)];
    [prev, next].forEach((item) => {
      if (!item?.image) return;
      const image = new Image();
      image.src = item.image;
    });
  }

  function showLightboxItem(index, direction = 0) {
    if (!imageLightboxImage || !lightboxItems.length) return;
    lightboxIndex = normalizeLightboxIndex(index);
    const item = lightboxItems[lightboxIndex];

    if (direction) {
      imageLightboxImage.classList.remove('slide-from-left', 'slide-from-right');
      // Force reflow so consecutive swipes replay the animation.
      void imageLightboxImage.offsetWidth;
      imageLightboxImage.classList.add(direction > 0 ? 'slide-from-right' : 'slide-from-left');
    }

    imageLightboxImage.src = item.image;
    imageLightboxImage.alt = item.alt || item.caption || 'صورة المنتج';
    if (imageLightboxCaption) imageLightboxCaption.textContent = item.caption || item.alt || '';
    if (imageLightboxCounter) imageLightboxCounter.textContent = `${lightboxIndex + 1} / ${lightboxItems.length}`;
    if (imageLightboxWhatsApp) {
      const isProduct = Boolean(item?.category || item?.model);
      const hasWhatsApp = Boolean(primaryWhatsAppNumber());
      imageLightboxWhatsApp.hidden = !(isProduct && hasWhatsApp);
      if (isProduct && hasWhatsApp) {
        imageLightboxWhatsApp.href = productWhatsAppUrl(item);
        imageLightboxWhatsApp.setAttribute(
          'aria-label',
          `استفسار واتساب عن ${productDisplayName(item)}${item?.model ? ` موديل ${item.model}` : ''}`
        );
      }
    }

    const hasMultiple = lightboxItems.length > 1;
    prevImageLightboxButton?.toggleAttribute('hidden', !hasMultiple);
    nextImageLightboxButton?.toggleAttribute('hidden', !hasMultiple);
    preloadLightboxNeighbors();
  }

  function openImageLightbox(item, trigger, collection = [item], index = 0) {
    if (!imageLightbox || !imageLightboxImage) return;
    trackEvent('product_image_open', analyticsProductParams(item));
    lightboxLastFocus = trigger || document.activeElement;
    lightboxItems = Array.isArray(collection) && collection.length ? collection : [item];
    const exactIndex = lightboxItems.indexOf(item);
    lightboxIndex = exactIndex >= 0 ? exactIndex : index;
    showLightboxItem(lightboxIndex);
    imageLightbox.classList.add('open');
    imageLightbox.setAttribute('aria-hidden', 'false');
    document.body.classList.add('image-lightbox-open');
    window.setTimeout(() => closeImageLightboxButton?.focus(), 0);
  }

  function showPreviousLightboxItem(method = 'button_or_keyboard') {
    if (lightboxItems.length < 2) return;
    showLightboxItem(lightboxIndex - 1, -1);
    const item = lightboxItems[lightboxIndex];
    if (item) trackEvent('product_gallery_navigation', analyticsProductParams(item, { direction: 'previous', method }));
  }

  function showNextLightboxItem(method = 'button_or_keyboard') {
    if (lightboxItems.length < 2) return;
    showLightboxItem(lightboxIndex + 1, 1);
    const item = lightboxItems[lightboxIndex];
    if (item) trackEvent('product_gallery_navigation', analyticsProductParams(item, { direction: 'next', method }));
  }

  function closeImageLightbox() {
    if (!imageLightbox?.classList.contains('open')) return;
    imageLightbox.classList.remove('open');
    imageLightbox.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('image-lightbox-open');
    imageLightboxImage?.removeAttribute('src');
    imageLightboxImage?.classList.remove('slide-from-left', 'slide-from-right');
    lightboxItems = [];
    if (lightboxLastFocus && typeof lightboxLastFocus.focus === 'function') lightboxLastFocus.focus();
  }

  if (closeImageLightboxButton) closeImageLightboxButton.addEventListener('click', closeImageLightbox);
  prevImageLightboxButton?.addEventListener('click', (event) => {
    event.stopPropagation();
    showPreviousLightboxItem('button');
  });
  nextImageLightboxButton?.addEventListener('click', (event) => {
    event.stopPropagation();
    showNextLightboxItem('button');
  });

  imageLightboxWhatsApp?.addEventListener('click', () => {
    const item = lightboxItems[lightboxIndex];
    if (item) trackEvent('product_whatsapp_click', analyticsProductParams(item, { source: 'image_lightbox' }));
  });

  if (imageLightbox) {
    imageLightbox.addEventListener('click', (event) => {
      if (event.target === imageLightbox) closeImageLightbox();
    });
  }

  if (imageLightboxStage) {
    imageLightboxStage.addEventListener('touchstart', (event) => {
      if (event.touches.length !== 1) return;
      touchStartX = event.touches[0].clientX;
      touchStartY = event.touches[0].clientY;
    }, { passive: true });

    imageLightboxStage.addEventListener('touchend', (event) => {
      if (!event.changedTouches.length || lightboxItems.length < 2) return;
      const deltaX = event.changedTouches[0].clientX - touchStartX;
      const deltaY = event.changedTouches[0].clientY - touchStartY;
      const horizontalSwipe = Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY) * 1.15;
      if (!horizontalSwipe) return;
      if (deltaX < 0) showNextLightboxItem('swipe');
      else showPreviousLightboxItem('swipe');
    }, { passive: true });
  }

  const catalogModal = $('#catalogModal');
  const openProducts = $('#openProducts');
  const closeProducts = $('#closeProducts');
  // Legacy embedded catalog download removed.


  renderProducts();
})();

</script>

<script id="flowerLightCloudScript">
(() => {
  'use strict';
  const cfg = window.FLOWER_LIGHT_SUPABASE || {};
  const configured = /^https:\/\/.+\.supabase\.co$/i.test(String(cfg.url || '').trim()) && String(cfg.anonKey || '').trim() && !String(cfg.anonKey).includes('YOUR_');
  let db = null;
  if (configured && window.supabase?.createClient) {
    db = window.supabase.createClient(String(cfg.url).trim(), String(cfg.anonKey).trim(), { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  }
  window.flSupabase = db;

  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const safeSlug = value => String(value || '').trim().toLowerCase().replace(/[\s_]+/g,'-').replace(/[^a-z0-9\u0600-\u06ff-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'') || `section-${Date.now()}`;
  const bucket = String(cfg.storageBucket || 'product-images');
  const EMPTY_IMAGE = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800"><rect width="800" height="800" fill="#f2f4f8"/><path d="M210 525l115-125 82 83 85-105 110 147H210z" fill="#c8d0dc"/><circle cx="310" cy="300" r="55" fill="#d8dee7"/><text x="400" y="650" text-anchor="middle" font-family="Arial" font-size="34" fill="#7b8598">No image</text></svg>')}`;
  const isExternalImage = value => /^(https?:|data:|blob:)/i.test(String(value || '').trim());
  const isStoragePath = value => Boolean(value) && !isExternalImage(value);

  function imageUrl(path){
    if (!path) return EMPTY_IMAGE;
    if (/^(https?:|data:|blob:)/i.test(path)) return path;
    if (!db) return '';
    return db.storage.from(bucket).getPublicUrl(path).data.publicUrl;
  }

  const contactLabels = {
    phone:'جوال',
    whatsapp:'واتساب',
    website:'الموقع الإلكتروني',
    email:'البريد الإلكتروني',
    location:'الموقع'
  };

  function cleanPhone(value){ return String(value || '').replace(/[^\d+]/g,''); }
  function cleanWhatsApp(value){ return String(value || '').replace(/\D/g,''); }
  function normalizeWebsite(value){
    const v=String(value||'').trim();
    if(!v) return '';
    return /^https?:\/\//i.test(v) ? v : `https://${v}`;
  }
  function contactHref(item){
    const value=String(item?.value||'').trim();
    if(!value) return '#';
    if(item.type==='phone') return `tel:${cleanPhone(value)}`;
    if(item.type==='whatsapp') return `https://wa.me/${cleanWhatsApp(value)}`;
    if(item.type==='email') return `mailto:${value}`;
    if(item.type==='website' || item.type==='location') return normalizeWebsite(value);
    return '#';
  }
  function contactIcon(type){
    if(type==='phone') return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.69 2.8a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.28-1.28a2 2 0 0 1 2.11-.45c.9.33 1.84.56 2.8.69A2 2 0 0 1 22 16.92z"></path></svg>';
    if(type==='whatsapp') return '<svg viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor;stroke:none;color:#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.206-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.371-.272.297-1.04 1.016-1.04 2.479s1.065 2.875 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.981.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.9 6.988c-.002 5.45-4.436 9.884-9.888 9.884m8.413-18.297A11.815 11.815 0 0 0 12.055 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.689 1.448h.005c6.557 0 11.893-5.335 11.896-11.893a11.82 11.82 0 0 0-3.488-8.413Z"></path></svg>';
    if(type==='email') return '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>';
    if(type==='location') return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>';
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>';
  }

  function setText(id,value){
    const el=document.getElementById(id); if(!el) return;
    const v=String(value||'').trim(); el.textContent=v; el.hidden=!v;
  }
  function setImage(id,path,alt=''){
    const el=document.getElementById(id); if(!el) return;
    if(path){el.src=imageUrl(path);el.alt=alt;el.hidden=false;} else {el.removeAttribute('src');el.alt='';el.hidden=true;}
  }

  function renderPublicProfile(){
    const profile=window.FLOWER_LIGHT_PROFILE || {};
    const contacts=(Array.isArray(window.FLOWER_LIGHT_CONTACTS)?window.FLOWER_LIGHT_CONTACTS:[]).filter(c=>c.is_visible!==false && String(c.value||'').trim());
    const brand=String(profile.brand_name||'').trim();
    const company=String(profile.company_name||'').trim();
    const fullName=String(profile.full_name||'').trim();
    const jobAr=String(profile.job_title_ar||'').trim();
    const jobEn=String(profile.job_title_en||'').trim();

    setImage('siteLogo',profile.logo_path,brand||company||'Logo');
    setImage('siteWatermark',profile.logo_path,'');
    setImage('sitePortrait',profile.portrait_path,fullName||'');
    setText('siteBrandName',brand);
    setText('siteCompanyName',company);
    setText('siteFullName',fullName);
    setText('siteJobTitleAr',jobAr);
    setText('siteJobTitleEn',jobEn);

    const brandRow=document.getElementById('siteBrandRow');
    const brandText=document.getElementById('siteBrandText');
    if(brandText) brandText.hidden=!(brand||company);
    if(brandRow) brandRow.hidden=!(brand||company||profile.logo_path);
    const portraitWrap=document.getElementById('sitePortraitWrap');
    if(portraitWrap) portraitWrap.hidden=!profile.portrait_path;
    const person=document.getElementById('sitePerson');
    if(person) person.hidden=!(fullName||jobAr||jobEn);
    const identity=document.getElementById('siteIdentity');
    if(identity) identity.hidden=!(profile.portrait_path||fullName||jobAr||jobEn);
    const hero=document.getElementById('siteHero');
    if(hero) hero.classList.toggle('profile-empty',!(brand||company||profile.logo_path||profile.portrait_path||fullName||jobAr||jobEn));

    const displayName=fullName||brand||company||'Digital Business Card';
    document.title=displayName;
    const card=document.getElementById('publicCard');
    if(card) card.setAttribute('aria-label',fullName?`Digital business card for ${fullName}`:'Digital business card');

    const quick=document.getElementById('quickActions');
    if(quick){
      const firstByType=[];
      ['phone','whatsapp','website','email'].forEach(type=>{const found=contacts.find(c=>c.type===type);if(found)firstByType.push(found);});
      quick.innerHTML=firstByType.map(item=>`<a class="action" href="${esc(contactHref(item))}" ${['whatsapp','website','location'].includes(item.type)?'target="_blank" rel="noopener noreferrer"':''} data-track="contact_${esc(item.type)}" aria-label="${esc(item.label||contactLabels[item.type]||'Contact')}">${contactIcon(item.type)}<span>${esc(item.label||contactLabels[item.type]||'Contact')}</span></a>`).join('');
      quick.hidden=!firstByType.length;
    }

    const list=document.getElementById('contactInfoList');
    if(list){
      list.innerHTML=contacts.map(item=>`<a class="info-item" href="${esc(contactHref(item))}" ${['whatsapp','website','location'].includes(item.type)?'target="_blank" rel="noopener noreferrer"':''} data-track="contact_${esc(item.type)}"><span class="info-icon">${contactIcon(item.type)}</span><span class="info-main"><span class="info-label">${esc(item.label||contactLabels[item.type]||'Contact')}</span><span class="info-value">${esc(item.value)}</span></span><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>`).join('');
    }
    const title=document.getElementById('contactTitle'); if(title) title.hidden=!contacts.length;

    const save=document.getElementById('saveContact');
    if(save) save.hidden=!(fullName||brand||company||contacts.length);

    const footer=document.getElementById('siteFooter');
    if(footer){const f=[brand||company,'DIGITAL BUSINESS CARD'].filter(Boolean).join(' · ');footer.textContent=f;footer.hidden=!f;}

    const sub=document.getElementById('productsButtonSubtitle');
    if(sub) sub.textContent=(brand||company)?`كتالوج منتجات ${brand||company}`:'تصفح الأقسام والمنتجات';
    const kicker=document.getElementById('catalogKicker');
    if(kicker){kicker.textContent=brand||company;kicker.hidden=!(brand||company);}
    const note=document.getElementById('catalogNote');
    if(note) note.textContent=(brand||company)?`استعرض أقسام ومنتجات ${brand||company}.`:'استعرض الأقسام والمنتجات.';

    window.flRenderProducts?.();
  }

  async function loadPublicProfile(){
    if(!db){window.FLOWER_LIGHT_PROFILE={};window.FLOWER_LIGHT_CONTACTS=[];renderPublicProfile();return false;}
    try{
      const [{data:profile,error:pe},{data:contacts,error:ce}]=await Promise.all([
        db.from('site_profile').select('*').eq('id',1).maybeSingle(),
        db.from('contact_items').select('*').eq('is_visible',true).order('sort_order',{ascending:true}).order('created_at',{ascending:true})
      ]);
      if(pe||ce) throw pe||ce;
      window.FLOWER_LIGHT_PROFILE=profile||{};
      window.FLOWER_LIGHT_CONTACTS=contacts||[];
      renderPublicProfile();
      return true;
    }catch(err){
      console.warn('[Site profile] load failed',err);
      window.FLOWER_LIGHT_PROFILE={};window.FLOWER_LIGHT_CONTACTS=[];renderPublicProfile();
      return false;
    }
  }
  window.flLoadPublicProfile=loadPublicProfile;

  function vcardEscape(value){return String(value||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
  function downloadDynamicVCard(){
    const p=window.FLOWER_LIGHT_PROFILE||{};
    const contacts=(Array.isArray(window.FLOWER_LIGHT_CONTACTS)?window.FLOWER_LIGHT_CONTACTS:[]).filter(c=>c.is_visible!==false&&String(c.value||'').trim());
    const fullName=String(p.full_name||p.brand_name||p.company_name||'').trim();
    if(!fullName&&!contacts.length) return;
    const lines=['BEGIN:VCARD','VERSION:3.0',`FN:${vcardEscape(fullName)}`];
    if(p.company_name||p.brand_name) lines.push(`ORG:${vcardEscape([p.company_name,p.brand_name].filter(Boolean).join(' - '))}`);
    if(p.job_title_ar||p.job_title_en) lines.push(`TITLE:${vcardEscape([p.job_title_ar,p.job_title_en].filter(Boolean).join(' / '))}`);
    contacts.forEach(item=>{
      if(item.type==='phone') lines.push(`TEL;TYPE=CELL:${vcardEscape(cleanPhone(item.value))}`);
      else if(item.type==='whatsapp'){
        const n=cleanWhatsApp(item.value); lines.push(`TEL;TYPE=CELL:${vcardEscape(n)}`); if(n)lines.push(`X-SOCIALPROFILE;TYPE=whatsapp:https://wa.me/${n}`);
      } else if(item.type==='email') lines.push(`EMAIL;TYPE=INTERNET:${vcardEscape(item.value)}`);
      else if(item.type==='website') lines.push(`URL:${vcardEscape(normalizeWebsite(item.value))}`);
      else if(item.type==='location') lines.push(`URL:${vcardEscape(normalizeWebsite(item.value))}`);
    });
    lines.push('END:VCARD');
    const blob=new Blob([lines.join('\r\n')+'\r\n'],{type:'text/vcard;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=(safeSlug(fullName)||'contact')+'.vcf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  document.getElementById('saveContact')?.addEventListener('click',()=>{downloadDynamicVCard();if(typeof window.flTrack==='function')window.flTrack('save_contact',{});});

  async function loadCloudProducts(){
    if (!db) return false;
    try {
      const [{data:cats,error:ce},{data:prods,error:pe}] = await Promise.all([
        db.from('categories').select('*').eq('is_visible',true).order('sort_order',{ascending:true}).order('created_at',{ascending:true}),
        db.from('products').select('*').eq('is_visible',true).order('sort_order',{ascending:true}).order('created_at',{ascending:true})
      ]);
      if (ce || pe) throw ce || pe;
      const visibleCats = Array.isArray(cats) ? cats : [];
      const visibleProds = Array.isArray(prods) ? prods : [];
      const grouped = new Map();
      visibleCats.forEach(c => grouped.set(c.id, []));
      visibleProds.forEach(p => {
        if (!grouped.has(p.category_id)) return;
        grouped.get(p.category_id).push({
          id:p.id, name:p.name || '', model:p.model || '', caption:p.caption || '',
          alt:p.caption || p.name || '', category:'',
          image:imageUrl(p.image_path || p.image_url || ''), image_path:p.image_path || '',
          sort_order:p.sort_order || 0, is_visible:p.is_visible !== false
        });
      });
      const extraSections = visibleCats.map(c => {
        const items = grouped.get(c.id) || [];
        items.forEach(item => item.category = c.name);
        return { id:c.id, name:c.name, slug:c.slug, description:c.description || '', sort_order:c.sort_order || 0, items };
      });
      window.FLOWER_LIGHT_PRODUCTS = { catalog: [], chandeliers: [], balfon: [], extraSections };
      window.flRenderProducts?.();
      return true;
    } catch (err) {
      console.warn('[Site] Supabase load failed.', err);
      window.FLOWER_LIGHT_PRODUCTS = { catalog: [], chandeliers: [], balfon: [], extraSections: [] };
      window.flRenderProducts?.();
      return false;
    }
  }
  window.flLoadCloudProducts = loadCloudProducts;

  // Public data starts empty and is populated only from Supabase.
  window.FLOWER_LIGHT_PROFILE = {};
  window.FLOWER_LIGHT_CONTACTS = [];
  window.FLOWER_LIGHT_PRODUCTS = { catalog: [], chandeliers: [], balfon: [], extraSections: [] };
  renderPublicProfile();
  if (db) { loadPublicProfile(); loadCloudProducts(); }

  const adminMode = new URLSearchParams(location.search).has('admin');
  if (!adminMode) return;

  // Disable the older static admin panel if it exists in cached copies.
  const oldShell = document.getElementById('flAdminShell');
  if (oldShell) { oldShell.classList.remove('open'); oldShell.setAttribute('aria-hidden','true'); }
  const shell = document.getElementById('flCloudAdmin');
  const body = document.getElementById('flCloudAdminBody');
  const logoutBtn = document.getElementById('flCloudLogout');
  const modal = document.getElementById('flCloudModal');
  const modalTitle = document.getElementById('flCloudModalTitle');
  const modalBody = document.getElementById('flCloudModalBody');
  const toast = document.getElementById('flCloudToast');
  shell.classList.add('open'); shell.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden';
  let view='overview'; let categories=[]; let products=[]; let profile={}; let contacts=[]; let selectedCategory='';
  let toastTimer;
  const notify = msg => { toast.textContent=msg; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('show'),2600); };
  const openModal = (title, html) => { modalTitle.textContent=title; modalBody.innerHTML=html; modal.classList.add('open'); modal.setAttribute('aria-hidden','false'); };
  const closeModal = () => { modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); modalBody.innerHTML=''; };
  document.getElementById('flCloudModalClose').addEventListener('click',closeModal);
  modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
  document.getElementById('flCloudPreview').addEventListener('click',()=>{ location.href=location.pathname; });
  logoutBtn.addEventListener('click', async()=>{ if(db) await db.auth.signOut(); renderLogin(); });

  function renderSetup(){
    logoutBtn.hidden=true;
    body.innerHTML=`<div class="fl-cloud-wrap"><div class="fl-cloud-login fl-cloud-setup"><h2>ربط Supabase مرة واحدة</h2><p>الملف جاهز، لكن يحتاج عنوان مشروع Supabase والمفتاح العام Publishable/Anon. بعد وضعهما في أعلى ملف <b>index.html</b> يصبح الحفظ مباشرًا.</p><div class="fl-cloud-note">ابحث داخل الملف عن <b>YOUR_SUPABASE_URL</b> و <b>YOUR_SUPABASE_ANON_KEY</b> واستبدلهما بالقيمتين من Supabase → Project Settings → API.</div><code>url: 'https://YOUR_PROJECT.supabase.co'\nanonKey: 'YOUR_PUBLISHABLE_OR_ANON_KEY'</code><p>بعدها ارفع index.html مرة واحدة فقط. كل تعديل لاحق للمنتجات والصور يتم من هذه اللوحة مباشرة.</p></div></div>`;
  }

  async function getSession(){ const {data} = await db.auth.getSession(); return data.session; }
  async function renderLogin(){
    logoutBtn.hidden=true;
    body.innerHTML=`<div class="fl-cloud-wrap"><div class="fl-cloud-login"><h2>تسجيل دخول الإدارة</h2><p>استخدم حساب المدير الذي أنشأته في Supabase Auth. الزوار لا يحتاجون إلى تسجيل دخول.</p><form id="flLoginForm"><div class="fl-cloud-field"><label>البريد الإلكتروني</label><input id="flLoginEmail" type="email" autocomplete="username" required></div><div class="fl-cloud-field"><label>كلمة المرور</label><input id="flLoginPassword" type="password" autocomplete="current-password" required></div><button class="fl-cloud-btn primary" type="submit">دخول</button></form><div id="flLoginMsg" class="fl-cloud-note bad" style="display:none;margin-top:12px"></div></div></div>`;
    document.getElementById('flLoginForm').addEventListener('submit',async e=>{ e.preventDefault(); const msg=document.getElementById('flLoginMsg'); msg.style.display='none'; const email=document.getElementById('flLoginEmail').value.trim(); const password=document.getElementById('flLoginPassword').value; const {error}=await db.auth.signInWithPassword({email,password}); if(error){msg.textContent='تعذر الدخول: '+error.message;msg.style.display='block';return;} await refresh(); renderApp(); });
  }

  async function refresh(){
    const [{data:c,error:ce},{data:p,error:pe},{data:pf,error:pfe},{data:ct,error:cte}] = await Promise.all([
      db.from('categories').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:true}),
      db.from('products').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:true}),
      db.from('site_profile').select('*').eq('id',1).maybeSingle(),
      db.from('contact_items').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:true})
    ]);
    if(ce||pe||pfe||cte) throw ce||pe||pfe||cte;
    categories=c||[]; products=p||[]; profile=pf||{}; contacts=ct||[];
    if(!selectedCategory && categories[0]) selectedCategory=categories[0].id;
    if(selectedCategory && !categories.some(c=>c.id===selectedCategory)) selectedCategory=categories[0]?.id||'';
  }

  async function fileToOptimizedBlob(file){
    if(!file) return null;
    const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>resolve(r.result);r.readAsDataURL(file);});
    const img=await new Promise((resolve,reject)=>{const i=new Image();i.onerror=reject;i.onload=()=>resolve(i);i.src=dataUrl;});
    const max=1400, scale=Math.min(1,max/Math.max(img.width,img.height)); const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)); const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);
    return await new Promise(resolve=>canvas.toBlob(blob=>resolve(blob||file),'image/webp',.82));
  }
  function dataUrlToBlob(dataUrl){ const [head,body]=dataUrl.split(','); const mime=(head.match(/data:(.*?);/)||[])[1]||'image/jpeg'; const bin=atob(body); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:mime}); }
  async function uploadBlob(blob,categoryId,base='product'){ const ext=(blob.type||'image/webp').includes('png')?'png':(blob.type||'').includes('jpeg')?'jpg':'webp'; const path=`${categoryId}/${crypto.randomUUID()}.${ext}`; const {error}=await db.storage.from(bucket).upload(path,blob,{contentType:blob.type||'image/webp',upsert:false,cacheControl:'31536000'}); if(error)throw error; return path; }

  }
  async function ensureImportCategory(name,slugHint='',description=''){
    const wantedName=String(name||'').trim(); const slug=safeSlug(slugHint||wantedName);
    let cat=categories.find(c=>c.slug===slug || String(c.name||'').trim().toLowerCase()===wantedName.toLowerCase());
    if(cat)return cat;
    const {data,error}=await db.from('categories').insert({name:wantedName||'قسم',slug,description:description||'',sort_order:categories.length,is_visible:true}).select().single();
    if(error){
      if(String(error.code)==='23505'){await refresh();return categories.find(c=>c.slug===slug || String(c.name||'').trim().toLowerCase()===wantedName.toLowerCase());}
      throw error;
    }
    categories.push(data); return data;
  }
  async function importOneProduct(cat,item,imageFilesByName,sortFallback){
    const key=importProductKey(cat.id,item);
    const duplicate=products.some(p=>importProductKey(p.category_id,p)===key);
    if(duplicate)return {skipped:true};
    let path='';
    if(item.imageFile && imageFilesByName?.has(item.imageFile.toLowerCase())){
      const file=imageFilesByName.get(item.imageFile.toLowerCase()); const blob=await fileToOptimizedBlob(file); path=await uploadBlob(blob,cat.id,item.name||item.model||'product');
    }else if(item.image?.startsWith('data:')){
      path=await uploadBlob(dataUrlToBlob(item.image),cat.id,item.name||item.model||'product');
    }else if(item.imageUrl && /^https?:\/\//i.test(item.imageUrl)){
      path=item.imageUrl;
    }else if(item.image?.startsWith('http')){
      path=item.image;
    }
    const payload={category_id:cat.id,name:item.name||item.caption||'منتج',model:item.model||'',caption:item.caption||item.alt||'',image_path:path,sort_order:Number.isFinite(Number(item.sort_order))?Number(item.sort_order):sortFallback,is_visible:item.is_visible!==false};
    const {data,error}=await db.from('products').insert(payload).select().single(); if(error)throw error; products.push(data); return {skipped:false};
  }

  (async()=>{
    if(!configured || !db){renderSetup();return;}
    const session=await getSession(); if(!session){renderLogin();return;}
    try{await refresh();renderApp();}catch(err){body.innerHTML=`<div class="fl-cloud-wrap"><div class="fl-cloud-note bad">تعذر قراءة قاعدة البيانات: ${esc(err.message||err)}. نفّذ ملفات إعداد Supabase المطلوبة أولًا ثم أعد فتح الصفحة.</div></div>`;}
  })();
})();
</script>
